name: Keep the demo awake

# Supabase pauses free projects after about a week without activity, which would
# break the demo. The API's /health endpoint queries the database, so calling it
# once a day counts as activity. It also wakes the sleeping Render instance.
on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the API health check
        env:
          API_URL: https://loan-file-assistant-api.onrender.com
        # A sleeping free instance takes about a minute to start, so allow retries.
        run: curl --fail --silent --show-error --retry 6 --retry-delay 20 --retry-all-errors --max-time 90 "$API_URL/health"
